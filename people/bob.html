  <style>
    :root{--paper:#f4f2e9;--ink:#183c30;--muted:#5b6a5c;--line:#c7cdbf;--sun:#e6b64b}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7}a{color:inherit;text-underline-offset:5px}button{font:inherit}a,button{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:5px}::selection{background:var(--sun);color:var(--ink)}
    .wrap{max-width:1280px;margin:auto;padding:0 64px}.skip{position:absolute;top:-100px;left:24px;background:var(--ink);color:var(--paper);padding:8px 16px;z-index:10}.skip:focus{top:16px}.header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:32px 0;border-bottom:1px solid var(--line)}.brand{display:inline-flex;align-items:center;gap:12px;font-size:20px;font-weight:600;letter-spacing:-.5px;text-decoration:none}.brand-mark{width:24px;height:24px;border-radius:50%;background:linear-gradient(to bottom,var(--ink) 58%,var(--sun) 58%)}.nav{display:flex;align-items:center;gap:32px;font-size:14px}.nav>a{text-decoration:none}.nav>a:hover{text-decoration:underline}.language{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:24px}.language button{border:0;border-radius:20px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:5px 10px}.language button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
    .hero{position:relative;padding:64px 0 72px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase}.hero h1{position:relative;font-family:Georgia,"Times New Roman",serif;font-size:clamp(76px,12vw,150px);font-weight:400;letter-spacing:-.055em;line-height:1.1;margin:32px 0 24px}.hero h1:after{content:"";display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--sun);margin-left:20px}.role{font-size:clamp(21px,2.5vw,28px);line-height:1.5;margin:0 0 32px}.role a{text-decoration-thickness:1px}.facts{display:flex;gap:64px;margin:0}.facts>div{min-width:0}.facts dt{font-size:12px;color:var(--muted);margin-bottom:6px}.facts dd{font-size:15px;margin:0}.section{display:grid;grid-template-columns:1fr 2fr;gap:48px;padding:56px 0;border-bottom:1px solid var(--line)}.section-label{display:flex;align-items:baseline;gap:24px;font-size:12px;letter-spacing:.08em}.section-number{color:var(--muted)}.section h2{font-size:30px;font-weight:400;line-height:1.4;letter-spacing:-.025em;margin:0 0 18px}.section p{max-width:570px;margin:0;color:var(--muted)}.contact-link{display:inline-block;font-size:clamp(19px,2.8vw,30px);line-height:1.5;overflow-wrap:anywhere;text-decoration-thickness:1px}.footer{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:32px 0 48px;font-size:13px;color:var(--muted)}.footer-name{font-size:16px;color:var(--ink);text-decoration:none}.footer-links{display:flex;gap:28px}.footer-links a{text-decoration:none}.footer-links a:hover{text-decoration:underline}
    @media(max-width:800px){.wrap{padding:0 32px}.nav{gap:20px}.section{gap:32px}.hero{padding:48px 0 56px}}
    @media(max-width:560px){.wrap{padding:0 24px}.header{padding:24px 0;gap:12px}.brand{font-size:18px}.nav{gap:12px}.nav>a{display:none}.hero{padding:40px 0 48px}.hero h1{font-size:clamp(64px,18vw,100px);margin:24px 0 20px}.hero h1:after{width:12px;height:12px;margin-left:12px}.role{font-size:21px}.facts{gap:40px;flex-wrap:wrap}.section{grid-template-columns:1fr;gap:24px;padding:40px 0}.section h2{font-size:26px}.footer{align-items:flex-start;padding:24px 0 32px}.footer-links{flex-direction:column;align-items:flex-end;gap:10px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <a class="skip" href="#main" data-en="Skip to content" data-zh="跳至正文">Skip to content</a>
  <div class="wrap">
    <header class="header">
      <a class="brand" href="../" aria-label="Siesta Lab home"><span class="brand-mark" aria-hidden="true"></span>Siesta Lab</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="../#people" data-en="People" data-zh="团队成员">People</a>
        <div class="language" role="group" aria-label="Language / 语言"><button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button><button type="button" data-lang="zh" aria-pressed="false" lang="zh-CN">中文</button></div>
      </nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="name">
        <span class="eyebrow" data-en="Siesta Lab / People" data-zh="Siesta Lab / 研究成员">Siesta Lab / People</span>
        <h1 id="name">Bob Siesta</h1>
        <p class="role"><span data-en="Researcher at " data-zh="研究员 · ">Researcher at </span><a href="../">Siesta Lab</a></p>
        <dl class="facts">
          <div><dt data-en="Affiliation since" data-zh="任职时间">Affiliation since</dt><dd data-en="2026 — Present" data-zh="2026 年 — 至今">2026 — Present</dd></div>
          <div><dt data-en="Location" data-zh="所在地">Location</dt><dd data-en="China" data-zh="中国">China</dd></div>
        </dl>
      </section>
      <section class="section" aria-labelledby="contact-title">
        <div class="section-label"><span class="section-number">01</span><span id="contact-title" data-en="CONTACT" data-zh="联系方式">CONTACT</span></div>
        <div><a class="contact-link" href="mailto:bobsiesta2026@163.com">bobsiesta2026@163.com</a></div>
      </section>
    </main>
    <footer class="footer"><a class="footer-name" href="../">Siesta Lab</a><div class="footer-links"><a href="../" data-en="Lab home ↗" data-zh="团队首页 ↗">Lab home ↗</a><a href="../#people" data-en="All people ↗" data-zh="全部成员 ↗">All people ↗</a></div></footer>
  </div>
  <script>
    const buttons = document.querySelectorAll('[data-lang]');
    function setLanguage(language) {
      const english = language === 'en';
      document.documentElement.lang = english ? 'en' : 'zh-CN';
      document.title = english ? 'Bob Siesta — Researcher at Siesta Lab' : 'Bob Siesta — Siesta Lab 研究员';
      document.querySelector('nav').setAttribute('aria-label', english ? 'Main navigation' : '主导航');
      document.querySelector('.brand').setAttribute('aria-label', english ? 'Siesta Lab home' : 'Siesta Lab 首页');
      document.querySelectorAll('[data-en][data-zh]').forEach(element => {
        element.textContent = element.getAttribute(english ? 'data-en' : 'data-zh');
      });
      buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === language)));
    }
    buttons.forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.lang)));
  </script>
</body>
</html>
